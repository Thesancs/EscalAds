<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>EscalAds Extension Settings</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 24px;
        background-color: #0f172a;
        color: #f8fafc;
      }
      .card {
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 12px;
        padding: 24px;
        max-width: 420px;
      }
      label {
        display: block;
        margin-bottom: 4px;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        background: rgba(15, 23, 42, 0.6);
        color: #f8fafc;
        margin-bottom: 16px;
      }
      button {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: none;
        background: linear-gradient(135deg, #38bdf8, #6366f1);
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      .status {
        margin-top: 12px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>EscalAds Collector</h1>
      <p>Configure the API endpoint, session token, and personal API key required to send captures.</p>
      <form id="options-form">
        <label for="apiBase">API Base URL</label>
        <input id="apiBase" name="apiBase" type="url" placeholder="http://localhost:4000" required />

        <label for="jwtToken">JWT Token</label>
        <input id="jwtToken" name="jwtToken" type="text" placeholder="eyJhbGciOi..." required />

        <label for="apiKey">API Key</label>
        <input id="apiKey" name="apiKey" type="text" placeholder="escalads_live_..." required />

        <button type="submit">Save settings</button>
        <div id="status" class="status"></div>
      </form>
    </div>
    <script type="module" src="options.js"></script>
  </body>
</html>
